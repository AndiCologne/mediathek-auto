<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2.6" fill="#7a3b00" opacity="0.10"/>
      <circle cx="12" cy="12" r="2.6" fill="#7a3b00" opacity="0.10"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#fff6c9" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff6c9" stop-opacity="0"/>
    </radialGradient>
    <g id="reel">
      <circle r="80" fill="#262626" stroke="#111" stroke-width="7"/>
      <circle r="66" fill="#4b4b4b" stroke="#111" stroke-width="4"/>
      <circle r="58" fill="none" stroke="#6a6a6a" stroke-width="3" stroke-dasharray="4 8"/>
      <g fill="#1a1a1a" stroke="#111" stroke-width="3">
        <circle cx="0" cy="-38" r="17"/>
        <circle cx="36.1" cy="-11.7" r="17"/>
        <circle cx="22.3" cy="30.7" r="17"/>
        <circle cx="-22.3" cy="30.7" r="17"/>
        <circle cx="-36.1" cy="-11.7" r="17"/>
      </g>
      <circle r="15" fill="#d9d9d9" stroke="#111" stroke-width="4"/>
      <circle r="5" fill="#111"/>
      <path d="M -50 -46 A 68 68 0 0 1 -6 -67" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="6" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- Hintergrund: Comic-Strahlenkranz -->
  <rect width="1280" height="640" fill="#FFC93C"/>
  <g transform="translate(640,300)" fill="#FFB020">
    <path d="M0 0 L-90 -900 L90 -900 Z"/>
    <path d="M0 0 L-90 -900 L90 -900 Z" transform="rotate(30)"/>
    <path d="M0 0 L-90 -900 L90 -900 Z" transform="rotate(60)"/>
    <path d="M0 0 L-90 -900 L90 -900 Z" transform="rotate(90)"/>
    <path d="M0 0 L-90 -900 L90 -900 Z" transform="rotate(120)"/>
    <path d="M0 0 L-90 -900 L90 -900 Z" transform="rotate(150)"/>
    <path d="M0 0 L-90 -900 L90 -900 Z" transform="rotate(180)"/>
    <path d="M0 0 L-90 -900 L90 -900 Z" transform="rotate(210)"/>
    <path d="M0 0 L-90 -900 L90 -900 Z" transform="rotate(240)"/>
    <path d="M0 0 L-90 -900 L90 -900 Z" transform="rotate(270)"/>
    <path d="M0 0 L-90 -900 L90 -900 Z" transform="rotate(300)"/>
    <path d="M0 0 L-90 -900 L90 -900 Z" transform="rotate(330)"/>
  </g>
  <rect width="1280" height="640" fill="url(#dots)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <!-- Straße -->
  <rect x="0" y="548" width="1280" height="92" fill="#3b3b4f"/>
  <rect x="0" y="548" width="1280" height="8" fill="#22222e"/>
  <g fill="#f4f1de">
    <rect x="30" y="592" width="90" height="10" rx="5"/>
    <rect x="190" y="592" width="90" height="10" rx="5"/>
    <rect x="1030" y="592" width="90" height="10" rx="5"/>
    <rect x="1190" y="592" width="90" height="10" rx="5"/>
  </g>
  <ellipse cx="645" cy="584" rx="400" ry="20" fill="#000" opacity="0.28"/>

  <!-- Filmstreifen, der sich hinter dem Auto abwickelt -->
  <g fill="none" stroke-linecap="butt">
    <path id="strip" d="M 360 520 C 280 540, 230 470, 160 485 S 60 560, -20 520"
          stroke="#111" stroke-width="44"/>
    <path d="M 360 520 C 280 540, 230 470, 160 485 S 60 560, -20 520" stroke="#2e2e2e" stroke-width="36"/>
    <path d="M 360 520 C 280 540, 230 470, 160 485 S 60 560, -20 520" stroke="#f4f1de" stroke-width="28" stroke-dasharray="8 9"/>
    <path d="M 360 520 C 280 540, 230 470, 160 485 S 60 560, -20 520" stroke="#2e2e2e" stroke-width="16"/>
    <path d="M 360 520 C 280 540, 230 470, 160 485 S 60 560, -20 520" stroke="#7fd1ff" stroke-width="12" stroke-dasharray="30 7" opacity="0.85"/>
  </g>

  <!-- Speedlines -->
  <g stroke="#111" stroke-width="10" stroke-linecap="round">
    <line x1="150" y1="300" x2="250" y2="300"/>
    <line x1="110" y1="360" x2="250" y2="360"/>
    <line x1="170" y1="420" x2="255" y2="420"/>
  </g>
  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round">
    <line x1="150" y1="300" x2="250" y2="300"/>
    <line x1="110" y1="360" x2="250" y2="360"/>
    <line x1="170" y1="420" x2="255" y2="420"/>
  </g>

  <!-- Kinositz auf dem Dach -->
  <g stroke="#111" stroke-width="6" stroke-linejoin="round" transform="translate(0,-40)">
    <!-- Dachträger -->
    <rect x="500" y="238" width="270" height="16" rx="8" fill="#b9c2cc"/>
    <rect x="575" y="222" width="18" height="22" fill="#8d97a3"/>
    <rect x="677" y="222" width="18" height="22" fill="#8d97a3"/>
    <!-- Rückenlehne -->
    <rect x="565" y="88" width="140" height="130" rx="30" fill="#C1121F"/>
    <path d="M 585 104 Q 635 92 685 104" fill="none" stroke="#ff6b6b" stroke-width="6" stroke-linecap="round"/>
    <line x1="612" y1="118" x2="612" y2="200" stroke="#8a0d17" stroke-width="5"/>
    <line x1="658" y1="118" x2="658" y2="200" stroke="#8a0d17" stroke-width="5"/>
    <!-- Sitzfläche -->
    <rect x="548" y="196" width="174" height="36" rx="16" fill="#E63946"/>
    <path d="M 566 206 L 704 206" stroke="#ff8a8a" stroke-width="5" stroke-linecap="round"/>
    <!-- Armlehnen -->
    <path d="M 522 236 L 522 168 Q 522 150 540 150 L 556 150 L 556 236 Z" fill="#7b4a2a"/>
    <path d="M 714 236 L 714 150 L 730 150 Q 748 150 748 168 L 748 236 Z" fill="#7b4a2a"/>
    <!-- Popcorn im Getränkehalter -->
    <path d="M 712 150 L 750 150 L 744 104 L 718 104 Z" fill="#ffffff"/>
    <path d="M 721 104 L 724 150 M 731 104 L 731 150 M 741 104 L 738 150" stroke="#E63946" stroke-width="6" stroke-linecap="butt"/>
    <path d="M 712 150 L 750 150 L 744 104 L 718 104 Z" fill="none"/>
    <g fill="#fff3c4" stroke-width="4">
      <circle cx="720" cy="100" r="10"/>
      <circle cx="736" cy="94" r="11"/>
      <circle cx="749" cy="102" r="9"/>
      <circle cx="728" cy="86" r="9"/>
      <circle cx="744" cy="82" r="8"/>
    </g>
  </g>

  <!-- Fahrgastzelle -->
  <g stroke="#111" stroke-width="7" stroke-linejoin="round" transform="translate(0,-40)">
    <path d="M 405 370 L 458 272 Q 468 254 494 254 L 768 254 Q 796 254 812 272 L 880 370 Z" fill="#d62839"/>
    <path d="M 472 354 L 503 285 Q 510 272 528 272 L 622 272 L 622 354 Z" fill="#9fe3ff"/>
    <path d="M 650 272 L 764 272 Q 782 272 791 286 L 838 354 L 650 354 Z" fill="#9fe3ff"/>
    <path d="M 520 300 L 540 282 M 512 330 L 556 290" stroke="#ffffff" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M 700 300 L 722 282 M 690 330 L 738 288" stroke="#ffffff" stroke-width="7" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Karosserie -->
  <g stroke="#111" stroke-width="7" stroke-linejoin="round">
    <path d="M 290 486 L 290 376 Q 292 330 342 326 L 930 326 Q 992 332 996 386 L 998 486
             Q 998 496 986 496 L 934 496 A 94 94 0 0 0 746 496 L 534 496 A 94 94 0 0 0 346 496
             L 302 496 Q 290 496 290 486 Z" fill="#E63946"/>
    <path d="M 312 352 Q 318 340 344 340 L 926 340 Q 960 342 972 356" fill="none" stroke="#ff8a8a" stroke-width="8" stroke-linecap="round"/>
    <!-- Türen -->
    <path d="M 420 332 L 420 404 M 645 332 L 645 488 M 868 332 L 868 404" fill="none" stroke-width="5"/>
    <rect x="590" y="342" width="34" height="10" rx="5" fill="#b9c2cc" stroke-width="4"/>
    <rect x="812" y="342" width="34" height="10" rx="5" fill="#b9c2cc" stroke-width="4"/>
    <!-- Scheinwerfer, Rücklicht, Stoßstangen -->
    <circle cx="976" cy="372" r="16" fill="#fff59d"/>
    <path d="M 992 362 L 1060 342 M 994 374 L 1070 374 M 992 386 L 1060 406" stroke="#fff59d" stroke-width="7" stroke-linecap="round"/>
    <rect x="284" y="356" width="20" height="30" rx="6" fill="#ffb703"/>
    <rect x="962" y="470" width="52" height="20" rx="10" fill="#b9c2cc"/>
    <rect x="274" y="470" width="46" height="20" rx="10" fill="#b9c2cc"/>
  </g>

  <!-- Schriftzug auf den Türen -->
  <g font-family="DejaVu Sans Condensed, DejaVu Sans, sans-serif" font-weight="bold" font-style="italic" text-anchor="middle">
    <text x="644" y="394" font-size="52" fill="#111" stroke="#111" stroke-width="14" stroke-linejoin="round">Mediathek-Auto</text>
    <text x="644" y="394" font-size="52" fill="#ffffff">Mediathek-Auto</text>
  </g>

  <!-- Filmrollen als Räder -->
  <use href="#reel" x="440" y="500"/>
  <use href="#reel" x="840" y="500"/>

  <!-- Sprechblase -->
  <g stroke="#111" stroke-width="7" stroke-linejoin="round">
    <path d="M 930 70 Q 930 40 960 40 L 1210 40 Q 1240 40 1240 70 L 1240 150 Q 1240 180 1210 180 L 1050 180 L 1000 236 L 1005 180 L 960 180 Q 930 180 930 150 Z" fill="#ffffff"/>
  </g>
  <g font-family="DejaVu Sans Condensed, DejaVu Sans, sans-serif" font-weight="bold" text-anchor="middle" fill="#111">
    <text x="1085" y="104" font-size="44">Film ab!</text>
    <text x="1085" y="148" font-size="24" fill="#C1121F">ARD · ZDF · IMDb ≥ 8.0</text>
  </g>

  <!-- Comic-Sterne -->
  <g fill="#ffffff" stroke="#111" stroke-width="5" stroke-linejoin="round">
    <path d="M 120 120 l 12 28 l 30 2 l -23 19 l 8 29 l -27 -16 l -25 17 l 7 -30 l -24 -18 l 30 -3 z"/>
    <path d="M 420 70 l 8 18 l 20 1 l -15 13 l 5 19 l -18 -10 l -16 11 l 4 -20 l -15 -12 l 20 -2 z"/>
    <path d="M 860 150 l 7 15 l 17 1 l -13 11 l 5 16 l -15 -9 l -14 10 l 4 -17 l -13 -10 l 17 -2 z"/>
  </g>
</svg>
